name: Build Firmware
on:
  push:
  pull_request:
jobs:
  build-platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: platformio run